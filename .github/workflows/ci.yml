name: UI CI

on:
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Check coverage
        run: npm run test:coverage

      - name: Check duplicate code
        run: npm run dup:check

      - name: Run production build
        run: npm run build

      - name: Package production build
        if: github.event_name != 'pull_request'
        run: tar -czf wildrift-ui-${{ github.sha }}.tgz .next package.json package-lock.json

      - name: Attest production build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ui/wildrift-ui-${{ github.sha }}.tgz

      - name: Upload production build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wildrift-ui-${{ github.sha }}
          path: ui/wildrift-ui-${{ github.sha }}.tgz
          retention-days: 14
