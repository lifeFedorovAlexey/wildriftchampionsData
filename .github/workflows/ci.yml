name: UI CI

on:
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Install local tooling dependencies
        run: npm ci --ignore-scripts
        working-directory: .

      - name: Test local development isolation
        run: npm run dev:test
        working-directory: .

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Check coverage
        run: npm run test:coverage

      - name: Check duplicate code
        run: npm run dup:check

      - name: Run production build
        run: npm run build

      - name: Package production build
        if: github.event_name != 'pull_request'
        run: tar -czf wildrift-ui-${{ github.sha }}.tgz .next package.json package-lock.json

      - name: Attest production build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ui/wildrift-ui-${{ github.sha }}.tgz

      - name: Upload production build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wildrift-ui-${{ github.sha }}
          path: ui/wildrift-ui-${{ github.sha }}.tgz
          retention-days: 14
