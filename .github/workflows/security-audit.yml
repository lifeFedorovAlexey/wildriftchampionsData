name: UI Security Audit

on:
  workflow_call:

jobs:
  audit-npm:
    name: Audit ${{ matrix.project.name }} dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: root
            directory: .
            lockfile: package-lock.json
          - name: ui
            directory: ui
            lockfile: ui/package-lock.json
          - name: wr-api
            directory: wr-api
            lockfile: wr-api/package-lock.json
          - name: wr-chat
            directory: wr-chat
            lockfile: wr-chat/package-lock.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project.lockfile }}

      - name: Install dependencies
        working-directory: ${{ matrix.project.directory }}
        run: npm ci

      - name: Audit all dependencies
        working-directory: ${{ matrix.project.directory }}
        run: npm audit --audit-level=high

      - name: Generate CycloneDX SBOM
        working-directory: ${{ matrix.project.directory }}
        shell: bash
        run: npm sbom --omit=dev --sbom-format=cyclonedx > "${{ runner.temp }}/${{ matrix.project.name }}.cdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-sbom-${{ matrix.project.name }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.project.name }}.cdx.json
          retention-days: 30
