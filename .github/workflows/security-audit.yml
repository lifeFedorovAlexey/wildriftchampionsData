name: UI Security Audit

on:
  workflow_call:

jobs:
  audit-npm:
    name: Audit ${{ matrix.project.name }} dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: root
            directory: .
            lockfile: package-lock.json
          - name: ui
            directory: ui
            lockfile: ui/package-lock.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project.lockfile }}

      - name: Install dependencies
        working-directory: ${{ matrix.project.directory }}
        run: npm ci

      - name: Audit all dependencies
        working-directory: ${{ matrix.project.directory }}
        run: npm audit --audit-level=high

      - name: Install linked root production dependencies for UI SBOM
        if: matrix.project.name == 'ui'
        run: npm ci --omit=dev --ignore-scripts

      - name: Generate CycloneDX SBOM
        working-directory: ${{ matrix.project.directory }}
        shell: bash
        run: npm sbom --omit=dev --sbom-format=cyclonedx > "${{ runner.temp }}/${{ matrix.project.name }}.cdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-sbom-${{ matrix.project.name }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.project.name }}.cdx.json
          retention-days: 30
